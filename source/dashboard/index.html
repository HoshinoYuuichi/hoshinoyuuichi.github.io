<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/img/favicon.png" />
<title>总控台 · Yuuichi's Blog</title>
<style>
  :root {
    --bg: #f6f7f9;
    --bar: #ffffff;
    --text: #1f2329;
    --muted: #8a9099;
    --border: #e5e7eb;
    --active: #0078e7;
    --active-bg: #eaf3fe;
  }
  html[data-theme="dark"] {
    --bg: #121212;
    --bar: #1c1c1e;
    --text: #e6e6e6;
    --muted: #9aa0a6;
    --border: #2c2c2e;
    --active: #4aa3ff;
    --active-bg: #16232f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-weight: 700;
    font-size: 15px;
    margin-right: 12px;
    white-space: nowrap;
  }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--active);
    background: var(--active-bg);
    font-weight: 600;
  }
  .stage { position: relative; flex: 1 1 auto; min-height: 0; }
  .pane {
    position: absolute;
    inset: 0;
    border: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
  }
  .pane.hidden { display: none; }
  .hint {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  @media (max-width: 720px) {
    .hint { display: none; }
    .brand { display: none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">总控台</div>
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" data-pane="content">内容管理</button>
      <button class="tab" role="tab" data-pane="comments">评论管理</button>
      <button class="tab" role="tab" data-pane="analytics">访问统计</button>
    </div>
    <div class="hint">首次使用各标签需分别登录一次</div>
  </div>
  <div class="stage">
    <iframe
      id="pane-content"
      class="pane"
      title="内容管理"
      src="/admin/"
    ></iframe>
    <iframe
      id="pane-comments"
      class="pane hidden"
      title="评论管理"
      data-src="https://yuuichi-waline.vercel.app/ui"
    ></iframe>
    <iframe
      id="pane-analytics"
      class="pane hidden"
      title="访问统计"
      data-src="https://umami.blog.yuuichi.me/dashboard"
    ></iframe>
  </div>

<script>
  (function () {
    var tabs = document.querySelectorAll('.tab')
    var panes = {
      content: document.getElementById('pane-content'),
      comments: document.getElementById('pane-comments'),
      analytics: document.getElementById('pane-analytics'),
    }

    function activate(name) {
      tabs.forEach(function (t) {
        t.classList.toggle('active', t.dataset.pane === name)
      })
      Object.keys(panes).forEach(function (key) {
        var pane = panes[key]
        var show = key === name
        pane.classList.toggle('hidden', !show)
        if (show && pane.dataset.src && !pane.src) {
          pane.src = pane.dataset.src
        }
      })
    }

    tabs.forEach(function (t) {
      t.addEventListener('click', function () {
        activate(t.dataset.pane)
      })
    })
  })()
</script>
</body>
</html>
