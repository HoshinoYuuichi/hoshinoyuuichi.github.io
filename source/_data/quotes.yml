local_quotes:
  - text: 永远相信美好的事情即将发生。
    from: 雷军
  - text: 我们都是阴沟的虫子，但总还得有人仰望星空。
    from: 王尔德
  - text: 生活不是等待风暴过去，而是学会在雨中起舞。
    from: ''
  - text: 你今天的努力，是幸运的伏笔。
    from: ''
  - text: 愿你出走半生，归来仍是少年。
    from: ''
  - text: 种一棵树最好的时间是十年前，其次是现在。
  - text: 泪藏于心，笑逐颜开。
  - text: 不要因为走得太远，而忘记为什么出发。
    from: 纪伯伦
  - text: 世界上只有一种英雄主义，就是看清生活的真相之后依然热爱生活。
    from: 罗曼·罗兰
  - text: 凡是过去，皆为序章。
    from: 莎士比亚
  - text: 梦想是一个天真的词，实现梦想是一个残酷的词。
    from: 哆啦A梦
  - text: 与其被自己的本性牵着走而痛苦，倒不如试着改变自己。
    from: 银魂
  - text: 人正是有了不能忘记的回忆，才会变得坚强。
    from: 夏目友人帐
  - text: 不管你在世界的哪个地方，我一定会，再次去见你的。
    from: 你的名字
  - text: 樱花飘落的速度，是每秒五厘米。
    from: 秒速五厘米
  - text: 就算发了一千条短信，心与心的距离也不会靠近一厘米。
    from: 秒速五厘米
  - text: 我们仰望同一片天空，却看着不同的地方。
    from: 秒速五厘米
  - text: 我始终觉得，是人就该有颗温柔的心。
    from: 夏目友人帐
  - text: 只要有想见的人，就不再是孤身一人了。
    from: 夏目友人帐
  - text: 看得见光，是因为有黑暗的存在。
    from: NARUTO
  - text: 真正重要的东西，就算失去自己珍贵的生命，也要用双手保护到底。
    from: 银魂
  - text: 我想成为一个温柔的人，因为曾被温柔的人那样对待，深深了解那种被温柔相待的感觉。
    from: 夏目友人帐
  - text: 青春是萤火绚丽的流动银河，灿烂却也极致短暂。
    from: 萤火之森
  - text: 每一个不曾起舞的日子，都是对生命的辜负。
    from: 尼采
  - text: 万物皆有裂痕，那是光照进来的地方。
    from: 莱昂纳德·科恩
  - text: 心之所向，素履以往；生如逆旅，一苇以航。
  - text: 乾坤未定，你我皆是黑马。
  - text: 怕什么真理无穷，进一寸有一寸的欢喜。
    from: 胡适
  - text: 既然选择了远方，便只顾风雨兼程。
    from: 汪国真
  - text: 愿你成为自己的太阳，无需凭借谁的光。
  - text: 此心安处，便是吾乡。
    from: 苏轼
