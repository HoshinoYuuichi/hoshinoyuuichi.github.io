qa:
  - q: 名字的由来？
    a: 喜欢「星野」这个姓氏，「悠一」则是随手翻字典挑的，念起来很顺口。
  - q: 现在在做什么？
    a: 一边为生活奔波，一边利用空闲时间折腾各种感兴趣的小项目。
  - q: 最喜欢的一句话？
    a: 泪藏于心，笑逐颜开。
  - q: 爱好？
    a: 看番、打游戏、听音乐、摄影，以及漫无目的地散步。
  - q: 喜欢的番？
    a: 涉猎很杂，治愈系和日常系偏多，偶尔也会热血上头。
  - q: 喜欢的音乐？
    a: JPOP、动画 OST、轻音乐，深夜时偏爱安静的钢琴。
  - q: 喜欢的季节？
    a: 秋天。凉爽、安静，连风都很温柔。
  - q: 旅行想去的地方？
    a: 想去一次日本的乡间，看看动画里那种安静的小镇。
  - q: 近期目标？
    a: 坚持写博客，把半途而废的项目一个个捡起来。
  - q: 想对访客说？
    a: 谢谢你的到访，愿你今天也有好事发生。
