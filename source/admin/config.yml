backend:
  name: github
  repo: HoshinoYuuichi/hoshinoyuuichi.github.io
  branch: main
  base_url: https://sveltia-cms-auth.hoshinoyuuichi.workers.dev

site_url: https://blog.yuuichi.me
display_url: https://blog.yuuichi.me
logo_url: https://blog.yuuichi.me/img/tit.png

locale: zh_Hans

media_folder: source/img/uploads
public_folder: /img/uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: source/_posts
    create: true
    slug: '{{slug}}'
    extension: md
    preview_path_date_field: date
    sortable_fields: [date, title]
    view_filters:
      - label: 最近文章
        field: date
        pattern: '202[5-9]'
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 发布日期, name: date, widget: datetime, format: 'YYYY-MM-DD HH:mm:ss', date_format: 'YYYY-MM-DD', time_format: 'HH:mm:ss' }
      - { label: 标签, name: tags, widget: list, required: false, default: [] }
      - { label: 分类, name: categories, widget: list, required: false, default: [] }
      - { label: 封面图, name: cover, widget: image, required: false }
      - { label: 摘要, name: description, widget: text, required: false }
      - { label: 正文, name: body, widget: markdown }

  - name: pagedata
    label: 页面内容
    label_singular: 页面内容
    files:
      - label: 公告与个人信息
        name: sitesettings
        file: source/_data/site.yml
        description: 修改侧边栏公告、作者简介、Follow Me 按钮、站点副标题等。
        fields:
          - { label: 侧边栏公告, name: announcement, widget: text, required: false }
          - { label: 作者卡片简介, name: author_desc, widget: text, required: false }
          - { label: 建站日期, name: runtime_publish_date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, hint: '用于网站运行时间' }
          - { label: Follow Me 文字, name: follow_me_text, widget: string }
          - { label: Follow Me 图标, name: follow_me_icon, widget: string, hint: '如 fab fa-github' }
          - { label: Follow Me 链接, name: follow_me_link, widget: string }
          - { label: 站点副标题, name: site_subtitle, widget: string, required: false }
          - { label: 站点描述, name: site_description, widget: text, required: false }
          - { label: Waline 服务地址, name: waline_server, widget: string, required: false, hint: '部署 Waline 后填入，如 https://waline.xxx.com' }
          - { label: Umami 统计脚本地址, name: umami_script, widget: string, required: false, hint: '如 https://umami.xxx.com/script.js' }
          - { label: Umami 网站ID, name: umami_id, widget: string, required: false, hint: '在 Umami 后台添加网站后得到的 data-website-id' }
      - label: 各页面背景图
        name: backgrounds
        file: source/_data/backgrounds.yml
        description: 替换每个页面顶部的背景图；留空则沿用默认。
        fields:
          - label: 页面背景
            name: pages
            widget: object
            collapsed: false
            fields:
              - { label: 首页, name: __home, widget: object, required: false, fields: [{ label: 顶部背景图, name: top_img, widget: image, required: false }] }
              - { label: 关于, name: about, widget: object, required: false, fields: [{ label: 顶部背景图, name: top_img, widget: image, required: false }] }
              - { label: Myself, name: myself, widget: object, required: false, fields: [{ label: 顶部背景图, name: top_img, widget: image, required: false }] }
              - { label: 时间轴, name: timeline, widget: object, required: false, fields: [{ label: 顶部背景图, name: top_img, widget: image, required: false }] }
              - { label: 友链, name: link, widget: object, required: false, fields: [{ label: 顶部背景图, name: top_img, widget: image, required: false }] }
              - { label: 留言板, name: messageboard, widget: object, required: false, fields: [{ label: 顶部背景图, name: top_img, widget: image, required: false }] }
              - { label: 归档, name: archives, widget: object, required: false, fields: [{ label: 顶部背景图, name: top_img, widget: image, required: false }] }
              - { label: 标签, name: tags, widget: object, required: false, fields: [{ label: 顶部背景图, name: top_img, widget: image, required: false }] }
              - { label: 分类, name: categories, widget: object, required: false, fields: [{ label: 顶部背景图, name: top_img, widget: image, required: false }] }
      - label: 首页名言
        name: quotes
        file: source/_data/quotes.yml
        description: 首页头图大字。在线模式会依次尝试启用的在线源，全部失败时从本地名言/动漫台词库随机显示。
        fields:
          - label: 显示模式
            name: mode
            widget: select
            options:
              - { label: '在线 + 内置随机', value: online }
              - { label: '仅本地随机', value: local }
              - { label: '固定单句', value: fixed }
          - { label: 固定单句, name: fixed_quote, widget: string }
          - label: 在线源（可添加/排序/启停）
            name: online_sources
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { label: 备注名, name: name, widget: string }
              - { label: 启用, name: enabled, widget: boolean, default: true }
              - label: 源类型
                name: type
                widget: select
                options:
                  - { label: '一言（hitokoto）', value: hitokoto }
                  - { label: '通用 JSON', value: json }
                  - { label: '纯文本（直接显示）', value: text }
              - { label: 接口地址 / 文本内容', name: url, widget: string }
              - { label: 正文字段路径（通用JSON）', name: text_path, widget: string, required: false }
              - { label: 出处字段路径（通用JSON）', name: from_path, widget: string, required: false }
          - label: 本地名言
            name: local_quotes
            widget: list
            summary: '{{fields.text}}'
            fields:
              - { label: 名言内容, name: text, widget: string }
              - { label: 出处, name: from, widget: string, required: false }
      - label: 导航菜单
        name: nav
        file: source/_data/nav.yml
        description: 编辑顶部导航。可增删菜单项、改名称/链接/图标；含子菜单的项会显示为下拉。
        fields:
          - label: 菜单项
            name: items
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { label: 名称, name: label, widget: string }
              - { label: 链接（含子菜单可留空）', name: url, widget: string, required: false }
              - { label: 图标, name: icon, widget: string, required: false }
              - label: 子菜单
                name: children
                widget: list
                required: false
                summary: '{{fields.label}}'
                fields:
                  - { label: 名称, name: label, widget: string }
                  - { label: 链接, name: url, widget: string }
                  - { label: 图标, name: icon, widget: string, required: false }
      - label: 友链数据
        name: linkdata
        file: source/_data/link.yml
        description: 在此添加/编辑友链分组与链接。
        fields:
          - label: 友链分组
            name: groups
            widget: list
            summary: '{{fields.class_name}}'
            fields:
              - { label: 分组名称, name: class_name, widget: string }
              - label: 链接列表
                name: link_list
                widget: list
                summary: '{{fields.name}}'
                fields:
                  - { label: 名称, name: name, widget: string }
                  - { label: 链接, name: link, widget: string }
                  - { label: 头像地址, name: avatar, widget: image, required: false }
                  - { label: 简介, name: descr, widget: string, required: false }
      - label: 关于页内容
        name: aboutdata
        file: source/_data/about.yml
        description: 编辑「关于」页的头像、简介、兴趣标签、联系方式和捐助。
        fields:
          - { label: 头像, name: avatar, widget: image }
          - { label: 中文名, name: name, widget: string }
          - { label: 英文名, name: name_en, widget: string }
          - { label: 身份标签, name: tagline, widget: string }
          - { label: 座右铭, name: motto, widget: string }
          - { label: 博客板块标题, name: blog_heading, widget: string }
          - { label: 博客板块引导语, name: blog_lead, widget: text }
          - label: 介绍要点
            name: intro
            widget: list
            summary: '{{fields.item}}'
            field: { label: 内容, name: item, widget: string }
          - { label: 底部说明（支持链接）, name: footer_note, widget: text, required: false }
          - { label: 兴趣标签标题, name: tags_heading, widget: string }
          - label: 兴趣标签
            name: tags
            widget: list
            summary: '{{fields.item}}'
            field: { label: 标签, name: item, widget: string }
          - { label: 联系方式标题, name: contact_heading, widget: string }
          - label: 联系方式
            name: links
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 图标图片地址, name: img, widget: string, hint: '可用 cdn.simpleicons.org/图标名/颜色' }
              - { label: 链接, name: url, widget: string, required: false, hint: '邮箱用 mailto: 开头' }
              - { label: 弹窗二维码, name: modal, widget: image, required: false, hint: '填写后点击图标弹出二维码' }
              - { label: 二维码提示, name: tip, widget: string, required: false }
          - { label: 捐助标题, name: donate_heading, widget: string }
          - { label: 捐助说明, name: donate_tip, widget: text, required: false }
          - label: 捐助方式
            name: donate
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 图标图片地址, name: img, widget: string }
              - { label: 收款二维码, name: modal, widget: image }
              - { label: 二维码提示, name: tip, widget: string, required: false }
      - label: 留言板内容
        name: messageboarddata
        file: source/_data/messageboard.yml
        description: 编辑「留言板」的横幅、须知与提示。
        fields:
          - { label: 横幅标题, name: heading, widget: string }
          - { label: 横幅副标题, name: sub, widget: text }
          - { label: 提示语, name: note, widget: text, required: false }
          - { label: 须知标题, name: rules_heading, widget: string }
          - label: 须知条目
            name: rules
            widget: list
            summary: '{{fields.item}}'
            field: { label: 内容, name: item, widget: text }
      - label: Myself 页内容
        name: myselfdata
        file: source/_data/myself.yml
        description: 编辑「Myself」页的横幅、关键词和十问十答。
        fields:
          - { label: 英文名, name: name_en, widget: string }
          - { label: 副标题, name: subtitle, widget: string }
          - label: 关键词
            name: keywords
            widget: list
            summary: '{{fields.item}}'
            field: { label: 关键词, name: item, widget: string }
          - label: 十问十答
            name: qa
            widget: list
            summary: 'Q · {{fields.q}}'
            fields:
              - { label: 问题, name: q, widget: string }
              - { label: 回答, name: a, widget: text }
      - label: 时间轴内容
        name: timelinedata
        file: source/_data/timeline.yml
        description: 编辑「时间轴」页的时间节点。
        fields:
          - { label: 开头语, name: intro, widget: text, required: false }
          - label: 时间节点
            name: items
            widget: list
            summary: '{{fields.date}} · {{fields.title}}'
            fields:
              - { label: 日期, name: date, widget: string, hint: '如 2026-09 或 Future' }
              - { label: 标题, name: title, widget: string }
              - { label: 描述, name: desc, widget: text }
              - { label: 标记为未来, name: future, widget: boolean, default: false }

  - name: pagelayout
    label: 分页内容
    label_singular: 页面
    folder: source/pages
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    identifier_field: title
    sortable_fields: [title, date]
    description: 在此新建或删除普通内容页。
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 发布日期, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: 顶部背景图, name: top_img, widget: image, required: false }
      - { label: 摘要, name: description, widget: text, required: false }
      - { label: 加入菜单, name: add_to_menu, widget: boolean, default: false, hint: '保存后自动加入顶部导航' }
      - { label: 正文, name: body, widget: markdown }
